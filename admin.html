<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aman Bingo Admin</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#12141c;--card:#1b1e29;--line:#2c3040;--tx:#e9e6dc;--mut:#8d91a3;--gold:#f2b84b;--ok:#4fbf8a;--bad:#e0645c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,sans-serif;padding:12px;max-width:900px;margin:auto}
h1{font-size:20px;margin:8px 0 12px}
input,button{font:inherit;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--tx);padding:10px 12px}
button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--gold)}
.pri{background:var(--gold);color:#1a1405;border-color:var(--gold);font-weight:600}
.ok{background:var(--ok);color:#06180f;border-color:var(--ok)}
.bad{background:var(--bad);color:#200806;border-color:var(--bad)}
#login{display:flex;gap:8px;flex-wrap:wrap}#login input{flex:1;min-width:180px}
nav{display:flex;gap:6px;overflow-x:auto;margin:10px 0}
nav button{white-space:nowrap}nav button.on{border-color:var(--gold);color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.card b{display:block;font-size:22px;color:var(--gold)}.card span{color:var(--mut);font-size:13px}
.card.tap{cursor:pointer;border-color:var(--gold)}.card.tap span:last-child{display:block;margin-top:2px;color:var(--gold);font-size:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.row small{color:var(--mut);display:block;word-break:break-all}
.row .acts{display:flex;gap:6px}
#msg{margin:10px 0;padding:10px;border-radius:8px;display:none}
#msg.err{display:block;background:#3a1b1a;border:1px solid var(--bad)}
#msg.good{display:block;background:#12301f;border:1px solid var(--ok)}
.empty{color:var(--mut);padding:16px 0}
.prow{border-bottom:1px solid var(--line);padding:8px 0}
.prow .row{border:0;padding:4px 0}
.prow .acts,.row .acts{flex-wrap:wrap}
.bantag{color:var(--bad)}
.form{display:flex;flex-direction:column;gap:8px;padding:12px 0}
.form label{color:var(--mut);font-size:13px}
.form input{width:100%}
.won{color:var(--gold)}
.acc{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0;display:flex;flex-direction:column;gap:8px}
.acc h3{margin:0;font-size:16px;color:var(--gold)}
.todaytag{color:var(--ok);font-size:12px;font-weight:600}
.vet{color:var(--ok);font-size:12px;font-weight:600}
</style>
</head>
<body>
<h1>Aman Bingo Admin</h1>
<div id="login">
  <input id="key" type="password" placeholder="Admin password" autocomplete="current-password">
  <button class="pri" id="go">Sign in</button>
</div>
<div id="msg"></div>
<div id="app" hidden>
  <nav id="tabs"></nav>
  <div id="view"></div>
</div>

<script>
// Same address the page is opened from. The old github.io page still talks to the Worker directly.
const API = location.hostname.endsWith("github.io") ? "https://aman-bingo.amanamazi180.workers.dev" : "";
const TABS = ["Overview","Pending","Players","Rounds","Game","AutoTake","Accounts","Bonus","Weekly","Log"];
let q = "";
const tgd = (window.Telegram && Telegram.WebApp && Telegram.WebApp.initData) || "";
if(tgd){ try{ Telegram.WebApp.ready(); Telegram.WebApp.expand(); }catch(e){} }
let key = sessionStorage.getItem("ak") || "", tab = "Overview";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function say(t, kind){ const m=$("msg"); m.textContent=t; m.className=kind||""; if(!t) m.style.display="none"; else m.style.display="block"; }

async function call(path, body){
  const opt = { headers:{ "X-Admin-Key": key, "X-Init-Data": tgd, "Content-Type":"application/json" } };
  if(body){ opt.method="POST"; opt.body=JSON.stringify(body); }
  let r;
  try { r = await fetch(API + path, opt); }
  catch(e){ throw new Error("Cannot reach " + (API || location.origin) + path + ". The Worker is down or the address is wrong."); }
  if(r.status===401||r.status===403) throw new Error("Wrong admin password.");
  if(r.status===404) throw new Error("The Worker has no route " + path + ". Add this route to worker.js.");
  if(!r.ok){
    const t = await r.text(); let m = t; try { m = JSON.parse(t).error || t; } catch(e){}
    const nice = { insufficient_balance:"That player does not have enough balance.", bad_input:"Please check what you entered (cartela numbers 1-600, amount at least 1 birr; account number 4-30 characters, name 2-40 characters).", no_player:"That Telegram ID is not a registered player. The support account must open the bot and share its phone number first.", no_support:"Enter the support account Telegram ID and how many cartelas to take.", bonus_taken:"One of those cartelas is already taken in the open round. Choose other cartelas, or set the bonus for the next round number.", already_paid:"That period was already paid.", no_prizes:"Set the prizes first (for example 3000, 2000, 1000).", no_winners:"Nobody played in that period, so there is nothing to pay.", bad_image:"That picture could not be used. Choose a normal photo (JPG or PNG).", bad_round:"That round number is not allowed. Leave it empty, or enter a round that has not started yet.", manual_off:"Manual approval of deposits is locked. The deposit is credited only when the bank SMS or verify.et confirms it.", already_on:"The weekly bonus is already ON.", not_on:"The weekly bonus is not running.", wk_running:"Stop the weekly bonus first (or wait until it ends), then pay the winners.", pay_first:"The last weekly bonus has winners who are not paid yet. Press \"Pay winners\" first (or clear the prizes), then start a new one." }[m];
    throw new Error(nice || ("Server error " + r.status + ": " + t.slice(0,200)));
  }
  return r.json();
}

// makes a small JPEG (max 480 px) from the chosen picture so it uploads fast
function fileToJpeg(file, max){ return new Promise((ok, no) => { const fr = new FileReader(); fr.onerror = () => no(new Error("Cannot read this file."));
  fr.onload = () => { const im = new Image(); im.onerror = () => no(new Error("Cannot read this picture."));
    im.onload = () => { const k = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement("canvas"); c.width = Math.max(1, Math.round(im.width * k)); c.height = Math.max(1, Math.round(im.height * k));
      const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); x.drawImage(im, 0, 0, c.width, c.height); ok(c.toDataURL("image/jpeg", 0.85)); };
    im.src = fr.result; };
  fr.readAsDataURL(file); }); }

function list(items, fn){ return items && items.length ? items.map(fn).join("") : '<div class="empty">Nothing here yet.</div>'; }

const BANKNAME = { telebirr:"Telebirr", boa:"Bank of Abyssinia (BOA)", mpesa:"M-Pesa", ebirr:"E-birr", cbe:"CBE", dashen:"Dashen" };
// how a deposit was credited: shown in the Deposits list and in the history
const HOW = { auto:"✅ approved by SMS match", sms:"✅ approved by SMS match", "verify.et":"✅ approved by verify.et", "sms+verify.et":"✅ approved by SMS + verify.et", admin:"approved by admin" };

const views = {
  async Overview(){
    const d = await call("/api/admin/overview");
    // the "Deposits today (count)" card is a button: it opens the list of the last 100 deposits with the player names
    const stats = [["Players",d.players],["Deposits today (birr)",d.deposits_today],["Deposits today (count)",d.deposits_today_count,"deposits"],["Deposits all time (birr)",d.deposits],["Withdrawals paid (birr)",d.withdrawals],["Player balances (birr)",d.held],["Pending requests",d.pending],["Rounds played",d.rounds]];
    return '<div class="grid">' + stats.map(([l,v,a])=> a
      ? `<div class="card tap" data-a="${a}" role="button" tabindex="0"><b data-a="${a}">${esc(v ?? 0)}</b><span data-a="${a}">${l}</span><span data-a="${a}">Tap to see the last 100 deposits ›</span></div>`
      : `<div class="card"><b>${esc(v ?? 0)}</b><span>${l}</span></div>`).join("") + "</div>";
  },
  async Deposits(){ // last 100 credited deposits with the player name and HOW each was approved (opened from the Overview card)
    const d = await call("/api/admin/deposits");
    const today = d.today_ts || 0;
    const head = `<div class="row"><button data-a="back-overview">‹ Overview</button><b>Last ${esc(d.items.length)} deposits</b></div>`;
    return head + list(d.items, x => `<div class="row"><div><b>${esc(x.name)}</b>${x.ts >= today ? ' <span class="todaytag">· today</span>' : ''}<small>${esc(x.phone)} · ${esc(BANKNAME[x.method] || x.method)}</small>${x.how ? `<small class="${/verify\.et/.test(x.how) ? "vet" : ""}" style="${/verify\.et/.test(x.how) ? "" : "color:var(--mut)"}">${esc(HOW[x.how] || x.how)}</small>` : ""}<small>${esc(new Date(x.ts).toLocaleString())}</small></div><b class="won">${esc(x.amount)} birr</b></div>`);
  },
  async Pending(){
    const d = await call("/api/admin/pending");
    const lbl = { approved:"✅ Approved", paid:"✅ Paid", rejected:"❌ Rejected" };
    const hist = d.history || [];
    return list(d.items, p => `<div class="row"><div><b>${esc(p.type)} ${esc(p.amount)} birr</b><small>${esc(p.name)} · ${esc(p.phone)}</small><small>${esc(p.detail)}</small></div>
      <div class="acts">${p.type==="deposit" && p.can_vet ? `<button data-a="recheck" data-id="${esc(p.id)}">🔎 verify.et</button>` : ""}${p.type==="deposit" && !p.manual ? '<span class="vet" style="color:var(--mut)">🔒 waiting for SMS / verify.et</span>' : `<button class="ok" data-a="approve" data-type="${esc(p.type)}" data-id="${esc(p.id)}">${p.type==="withdraw"?"Mark paid":"Approve"}</button>`}<button class="bad" data-a="reject" data-type="${esc(p.type)}" data-id="${esc(p.id)}">Reject</button></div></div>`)
      + `<h2 style="font-size:16px;margin:20px 0 2px">History · last 24 hours</h2><small style="color:var(--mut)">Handled requests stay here for 24 hours and then disappear from this list.</small>`
      + (hist.length ? hist.map(h => `<div class="row"><div><b>${esc(h.type)} ${esc(h.amount)} birr</b><small>${esc(h.name)} · ${esc(h.phone)}</small><small>${esc(h.detail)}</small></div><small style="text-align:right"><b>${lbl[h.status] || esc(h.status)}</b><br>${esc(new Date(h.ts).toLocaleString())}</small></div>`).join("") : '<div class="empty">No handled requests in the last 24 hours.</div>');
  },
  async Players(){
    const d = await call("/api/admin/players?q=" + encodeURIComponent(q));
    const box = `<div class="row"><input id="q" placeholder="Search name, phone or ID" value="${esc(q)}" style="flex:1;min-width:0"><button class="pri" data-a="search">Search</button></div>`;
    return box + list(d.items, p => `<div class="prow"><div class="row"><div><b>${esc(p.name)}${p.banned ? ' <span class="bantag">· banned</span>' : ''}</b><small>${esc(p.phone)} · ID ${esc(p.id)}</small></div><b>${esc(p.balance)} birr</b></div>
      <div class="acts"><input type="number" step="any" min="0" placeholder="birr" id="amt-${esc(p.id)}" style="width:100px"><button class="ok" data-a="add" data-id="${esc(p.id)}">Add</button><button data-a="remove" data-id="${esc(p.id)}">Remove</button><button class="bad" data-a="${p.banned ? "unban" : "ban"}" data-id="${esc(p.id)}">${p.banned ? "Unban" : "Ban"}</button></div></div>`);
  },
  async Rounds(){
    const d = await call("/api/admin/rounds");
    return list(d.items, r => `<div class="row"><div><b>Round ${esc(r.id)}</b><small>${esc(r.status)} · ${esc(r.players)} players</small></div><b>${esc(r.pot)} birr</b></div>`);
  },
  async Game(){
    const d = await call("/api/admin/game");
    return `<div class="grid"><div class="card"><b>${d.paused ? "Paused" : esc(d.status)}</b><span>Round ${esc(d.round)}</span></div>
      <div class="card"><b>${esc(d.stake)}</b><span>Stake this round (birr)</span></div>
      <div class="card"><b>${esc(d.players)}</b><span>Players</span></div>
      <div class="card"><b>${esc(d.cards)}</b><span>Cards</span></div></div>
      <div class="row"><div class="acts">${d.paused ? '<button class="ok" data-a="resume">Resume game</button>' : '<button class="bad" data-a="pause">Pause new rounds</button>'}<button data-a="game-start">Start round (if idle)</button><button class="bad" data-a="game-stop">Cancel round and refund</button></div></div>
      <div class="row"><div class="acts"><input id="stake" type="number" min="1" step="any" value="${esc(d.next_stake)}" style="width:110px"><button class="pri" data-a="save-stake">Save stake</button></div><small>Stake for new rounds (birr). The current round keeps its stake.</small></div>`;
  },
  async AutoTake(){ // take cartelas automatically for the support account, every round, until switched OFF
    const d = await call("/api/admin/autotake");
    return `<div class="grid"><div class="card"><b style="color:${d.on ? "var(--ok)" : "var(--bad)"}">${d.on ? "ON" : "OFF"}</b><span>Take cartelas</span></div>
      <div class="card"><b>${esc(d.count || 0)}</b><span>Cartelas per round</span></div>
      <div class="card"><b>${esc(d.taken)}</b><span>Taken now (round ${esc(d.round)}, ${esc(d.status)})</span></div>
      <div class="card"><b>${d.balance == null ? "-" : esc(d.balance)}</b><span>Support balance (birr)${d.support_name ? " · " + esc(d.support_name) : ""}</span></div></div>
    <div class="form">
      <small style="color:var(--mut)">While this is ON, at the start of every round the server takes this many random cartelas for your support account, a different set every round. The stake is paid from the support account balance (keep enough birr on it), and if one of these cartelas wins, the prize goes to the support account. Switch it OFF to stop from the next round.</small>
      <label>Support account Telegram ID (it must have opened the bot and registered; find the ID in the Players tab)</label>
      <input id="at-u" type="number" inputmode="numeric" value="${esc(d.support)}" autocomplete="off">
      <label>How many cartelas to take every round (1 to 30)</label>
      <input id="at-n" type="number" min="1" max="30" step="1" value="${esc(d.count || 5)}">
      <div style="display:flex;gap:6px;flex-wrap:wrap"><button class="ok" data-a="autotake" data-on="1">Turn ON / save</button>${d.on ? '<button class="bad" data-a="autotake" data-on="0">Turn OFF</button>' : ""}</div>
    </div>`;
  },
  async Accounts(){ // deposit accounts (number, name and picture) shown to players in the bot and in the game wallet
    const d = await call("/api/admin/accounts");
    const order = ["telebirr","boa","mpesa","ebirr"];
    return `<small style="color:var(--mut)">These are the accounts players are told to pay into (and the banks they can choose when they withdraw). A change is used at once in the bot deposit steps and in the game Wallet. Money already sent to an old account is not affected.</small>` +
      order.map(k => { const x = d.items[k] || {a:"",h:"",img:""};
        return `<div class="acc"><h3>${BANKNAME[k]}</h3>
          <label style="color:var(--mut);font-size:13px">Account / phone number</label>
          <input id="ac-n-${k}" value="${esc(x.a)}" autocomplete="off" inputmode="numeric">
          <label style="color:var(--mut);font-size:13px">Account holder name</label>
          <input id="ac-h-${k}" value="${esc(x.h)}" autocomplete="off">
          <div><button class="pri" data-a="save-acc" data-bank="${k}">Save ${BANKNAME[k].split(" ")[0]}</button></div>
          <label style="color:var(--mut);font-size:13px">Account picture (shown to players in the game wallet and sent with the deposit instructions in the bot)</label>
          ${x.img ? `<img src="${esc(x.img)}" alt="" style="width:96px;height:96px;object-fit:cover;border-radius:12px;border:1px solid var(--line)">` : '<small style="color:var(--mut)">No picture yet (the logo file in the game folder is used).</small>'}
          <input id="ac-f-${k}" type="file" accept="image/*">
          <div style="display:flex;gap:6px;flex-wrap:wrap"><button class="ok" data-a="upload-acc-img" data-bank="${k}">Upload picture</button>${x.img ? `<button class="bad" data-a="clear-acc-img" data-bank="${k}">Remove picture</button>` : ""}</div></div>`; }).join("");
  },
  async Bonus(){
    const d = await call("/api/admin/bonus");
    // live = the bonus round has not started yet (open lobby, or a round that comes later)
    const live = d.on && (d.round > d.current || (d.round === d.current && d.status === "lobby"));
    const head = d.on
      ? `<div class="grid"><div class="card"><b>Round ${esc(d.round)}</b><span>${live ? "Bonus is waiting for a player" : "Bonus round already started or finished"}</span></div><div class="card"><b>${esc(d.current)}</b><span>Current round (${esc(d.status)})</span></div></div>`
      : `<div class="empty">No bonus is set. Players see nothing until you save one below.</div>`;
    const items = d.on ? list(d.items, i => `<div class="row"><div><b>Cartela ${esc(i.c)}</b><small>${esc(i.amount)} birr</small></div><b class="${i.won ? "won" : ""}">${i.won ? "🎉 " + esc(i.won) : "not taken"}</b></div>`) : "";
    return head + items + `<div class="form">
      <small style="color:var(--mut)">Secret: only you see these numbers. In a bonus round every taken cartela is locked, and the first player who takes a bonus cartela (and can pay the stake) wins it at once and everybody sees the congratulations.</small>
      <label>Bonus amount (birr) — used for cartelas written without an amount</label>
      <input id="bn-amt" type="number" min="1" step="any" value="50">
      <label>Bonus cartelas — for example: 7, 12, 33  or with their own amount: 7=50, 12=100</label>
      <input id="bn-c" placeholder="7, 12, 33" autocomplete="off">
      <label>Round number (leave empty = the open round, or the next one if a game is running)</label>
      <input id="bn-r" type="number" min="1" step="1" placeholder="auto">
      <div class="acts" style="display:flex;gap:6px;flex-wrap:wrap"><button class="pri" data-a="save-bonus">Save bonus</button>${d.on ? '<button class="bad" data-a="clear-bonus">Cancel bonus</button>' : ""}</div>
    </div>`;
  },
  async Weekly(){ // the weekly bonus (top 1-10 players by games played): the admin switches it ON / OFF
    const d = await call("/api/admin/weekly");
    const rows = (items, empty) => items && items.length ? items.map(x => `<div class="row"><div><b>#${esc(x.rank)} ${esc(x.name)}</b><small>${esc(x.phone)} · ${esc(x.games)} games</small></div><b class="won">${x.prize ? esc(x.prize) + " birr" : "-"}</b></div>`).join("") : `<div class="empty">${empty}</div>`;
    const left = Math.max(0, d.ends_ts - d.now), days = Math.floor(left / 864e5), hrs = Math.floor(left % 864e5 / 36e5);
    const fin = d.start_ts > 0 && !d.running;
    const canPay = fin && d.last_week.length && !d.last_paid && d.prizes.some(p => p > 0);
    const sw = d.running
      ? `<div class="grid"><div class="card"><b style="color:var(--ok)">ON</b><span>Weekly bonus</span></div><div class="card"><b>${days}d ${hrs}h</b><span>Left until it ends by itself</span></div></div>
         <div class="form"><small style="color:var(--mut)">Players are ranked by games played since you pressed Start. Players see the ranking and the prizes in the Scores tab.</small><div><button class="bad" data-a="wk-stop">Stop weekly bonus now</button></div></div>`
      : `<div class="grid"><div class="card"><b style="color:var(--bad)">OFF</b><span>Weekly bonus</span></div></div>
         <div class="form"><small style="color:var(--mut)">While it is OFF no games are counted and players see that the weekly bonus has not started. Press Start when you want it to begin: games are counted from that moment.</small>
         <label>How many days it runs (1 to 30). It stops by itself after that, or earlier when you press Stop.</label>
         <input id="wk-days" type="number" min="1" max="30" step="1" value="7">
         <div><button class="ok" data-a="wk-start">Start weekly bonus now</button></div></div>`;
    return sw + `<div class="form">
      <label>Prizes for rank 1, 2, 3 ... (up to 10, in birr). Empty = no prizes shown.</label>
      <input id="wk-pr" placeholder="3000, 2000, 1000, 500, 500, 500, 500, 500, 500, 500" value="${esc(d.prizes.join(", "))}" autocomplete="off">
      <div class="acts" style="display:flex;gap:6px"><button class="pri" data-a="save-prizes">Save prizes</button></div>
    </div>
    ${d.running ? `<h2 style="font-size:16px;margin:14px 0 0">Ranking now</h2>${rows(d.this_week, "Nobody has played since the start yet.")}` : ""}
    ${fin ? `<h2 style="font-size:16px;margin:18px 0 0">Finished weekly bonus ${d.last_paid ? "· ✅ paid" : ""}</h2>${rows(d.last_week, "Nobody played in that period.")}` : ""}
    ${canPay ? '<div class="form"><button class="ok" data-a="pay-weekly">Pay winners</button><small style="color:var(--mut)">Adds each prize to the winner\'s balance and sends them a congratulations message. Can be done only once per weekly bonus.</small></div>' : ""}`;
  },
  async Log(){
    const d = await call("/api/admin/log");
    return list(d.items, x => `<div class="row"><div><b>${esc(x.action)}</b><small>${esc(x.detail)}</small></div><small style="text-align:right">${esc(new Date(x.ts).toLocaleString())}<br>${x.actor === "password" ? "password" : "admin " + esc(x.actor)}</small></div>`);
  }
};

async function show(){
  $("tabs").innerHTML = TABS.map(t=>`<button class="${t===tab?'on':''}" data-t="${t}">${t}</button>`).join("");
  $("view").innerHTML = '<div class="empty">Loading…</div>';
  try { $("view").innerHTML = await views[tab](); say(""); }
  catch(e){ $("view").innerHTML = ""; say(e.message, "err"); }
}

$("tabs").onclick = e => { const t=e.target.dataset.t; if(t){ tab=t; show(); } };
$("view").onclick = async e => {
  const el = e.target.closest("[data-a]"); if(!el) return;
  const a = el.dataset.a;
  const id = Number(el.dataset.id);
  try {
    if(a==="deposits"){ tab="Deposits"; return show(); }
    if(a==="back-overview"){ tab="Overview"; return show(); }
    if(a==="search"){ q=$("q").value.trim(); return show(); }
    if(a==="recheck"){ // 🔎 verify.et: check this pending deposit again; it is credited only if every automatic safety rule passes
      say("Checking with verify.et… (up to 10 seconds)");
      const r = await call("/api/admin/recheck", {id});
      say(r.text, r.ok ? "good" : "err"); setTimeout(show, r.ok ? 1200 : 4000); return;
    }
    if(a==="approve"||a==="reject"){
      const r = await call("/api/admin/"+a, {id, type:el.dataset.type});
      if(r.ok===false){ say("Already processed.", "err"); setTimeout(show, 800); return; }
    } else if(a==="add"||a==="remove"){
      const v = Number($("amt-"+id).value); if(!(v>0)) return say("Enter an amount in birr.", "err");
      await call("/api/admin/adjust", {id, amount: a==="add" ? v : -v});
    } else if(a==="ban"||a==="unban"){ await call("/api/admin/"+a, {id});
    } else if(a==="save-stake"){
      const v = Number($("stake").value); if(!(v>=1)) return say("Enter a stake of at least 1 birr.", "err");
      await call("/api/admin/set-stake", {stake:v});
    } else if(a==="save-acc"){
      const bank = el.dataset.bank, number = $("ac-n-"+bank).value.trim(), name = $("ac-h-"+bank).value.trim();
      if(number.length<4) return say("Enter the account or phone number.", "err");
      if(name.length<2) return say("Enter the account holder name.", "err");
      if(!confirm("Save this " + BANKNAME[bank] + " account?\n\n" + number + "\n" + name + "\n\nPlayers will be told to pay into it.")) return;
      await call("/api/admin/set-account", {bank, number, name});
      say("Account saved. Players now see the new number and name.", "good"); setTimeout(show, 700); return;
    } else if(a==="upload-acc-img"){
      const bank = el.dataset.bank, f = $("ac-f-"+bank).files[0]; if(!f) return say("Choose a picture first.", "err");
      const data = await fileToJpeg(f, 480);
      await call("/api/admin/set-account-image", {bank, data});
      say("Picture saved.", "good"); setTimeout(show, 700); return;
    } else if(a==="clear-acc-img"){
      const bank = el.dataset.bank; if(!confirm("Remove this picture?")) return;
      await call("/api/admin/clear-account-image", {bank});
      say("Picture removed.", "good"); setTimeout(show, 700); return;
    } else if(a==="autotake"){
      const on = el.dataset.on === "1", body = { on };
      if(on){ body.support = $("at-u").value.trim(); body.count = $("at-n").value.trim(); }
      await call("/api/admin/set-autotake", body);
      say(on ? "Take cartelas is ON. It starts with the open lobby or the next round." : "Take cartelas is OFF.", "good"); setTimeout(show, 700); return;
    } else if(a==="save-bonus"){
      const cartelas = $("bn-c").value.trim(); if(!cartelas) return say("Enter the bonus cartela numbers.", "err");
      const amount = Number($("bn-amt").value); if(!(amount>=1) && !/=/.test(cartelas)) return say("Enter a bonus amount of at least 1 birr.", "err");
      const r = await call("/api/admin/set-bonus", {amount, cartelas, round: $("bn-r").value.trim()});
      say("Bonus saved for round " + r.round + ".", "good"); setTimeout(show, 600); return;
    } else if(a==="wk-start"){
      const days = Number($("wk-days").value) || 7;
      if(!confirm("Start the weekly bonus now for " + days + " day(s)? Games are counted from this moment.")) return;
      await call("/api/admin/wk-start", {days});
      say("Weekly bonus is ON. Games are counted from now.", "good"); setTimeout(show, 600); return;
    } else if(a==="wk-stop"){
      if(!confirm("Stop the weekly bonus now? Games will no longer be counted. You can then pay the winners.")) return;
      await call("/api/admin/wk-stop", {});
      say("Weekly bonus is OFF. You can now pay the winners.", "good"); setTimeout(show, 600); return;
    } else if(a==="save-prizes"){
      const r = await call("/api/admin/set-prizes", {prizes: $("wk-pr").value.trim()});
      say(r.prizes.length ? "Prizes saved." : "Prizes cleared.", "good"); setTimeout(show, 600); return;
    } else if(a==="pay-weekly"){
      if(!confirm("Pay the winners now? This can be done only once.")) return;
      const r = await call("/api/admin/pay-weekly", {});
      say("Paid " + r.total + " birr to " + r.paid + " players.", "good"); setTimeout(show, 600); return;
    } else if(a==="clear-bonus"){
      if(!confirm("Cancel the bonus?")) return;
      await call("/api/admin/clear-bonus", {});
    } else if(a==="pause"||a==="resume"){ await call("/api/admin/pause", {paused: a==="pause"});
    } else await call("/api/admin/"+a, {});
    say("Done.", "good"); setTimeout(show, 600);
  } catch(err){ say(err.message, "err"); }
};
$("view").addEventListener("keydown", e => { if(e.target.id==="q" && e.key==="Enter"){ q=e.target.value.trim(); show(); } if(e.key==="Enter" && e.target.classList && e.target.classList.contains("tap")) e.target.click(); });
$("go").onclick = async () => {
  key = $("key").value.trim(); if(!key) return say("Enter the admin password.", "err");
  try { await call("/api/admin/overview"); sessionStorage.setItem("ak", key); $("login").hidden=true; $("app").hidden=false; show(); }
  catch(e){ say(e.message, "err"); }
};
$("key").addEventListener("keydown", e => { if(e.key==="Enter") $("go").click(); });
if(key){ $("key").value=key; $("go").click(); }
else if(tgd){ call("/api/admin/overview").then(()=>{ $("login").hidden=true; $("app").hidden=false; show(); }).catch(()=>{}); }
</script>
</body>
</html>
